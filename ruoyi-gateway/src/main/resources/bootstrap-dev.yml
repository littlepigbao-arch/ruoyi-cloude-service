# Tomcat
server:
  port: 8080

# Spring
spring: 
  application:
    # 应用名称
    name: ruoyi-gateway
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: local-nacos.zkjiadi.cc
        namespace: 78a7f41e-46cc-437a-9716-735888227693
      config:
        # 配置中心地址
        server-addr: local-nacos.zkjiadi.cc
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
        namespace: 78a7f41e-46cc-437a-9716-735888227693
    sentinel:
      # 取消控制台懒加载
      eager: true
      transport:
        # 控制台地址
        dashboard: local-nacos.zkjiadi.cc:8718
      # nacos配置持久化
      datasource:
        ds1:
          nacos:
            server-addr: nacos.zkjiadi.cc
            dataId: sentinel-ruoyi-gateway
            groupId: DEFAULT_GROUP
            data-type: json
            rule-type: gw-flow